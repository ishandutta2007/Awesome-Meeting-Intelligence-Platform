<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* <![CDATA[ */
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    
    /* Dynamic Wave and Pulse Animations */
    @keyframes waveFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-15px, 10px) scale(1.02); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes waveFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -12px) scale(0.98); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes pulseRing {
      0% { r: 4px; opacity: 0.8; }
      50% { r: 12px; opacity: 0.2; }
      100% { r: 4px; opacity: 0.8; }
    }
    @keyframes soundBar {
      0%, 100% { height: 12px; y: 154px; }
      50% { height: 36px; y: 142px; }
    }

    .wave1 { animation: waveFloat1 8s ease-in-out infinite; transform-origin: center; }
    .wave2 { animation: waveFloat2 10s ease-in-out infinite; transform-origin: center; }
    .pulsing-dot { animation: pulseRing 3s ease-in-out infinite; }
    .bar1 { animation: soundBar 1.2s ease-in-out infinite; }
    .bar2 { animation: soundBar 1.6s ease-in-out infinite 0.3s; }
    .bar3 { animation: soundBar 1.1s ease-in-out infinite 0.6s; }
    .bar4 { animation: soundBar 1.4s ease-in-out infinite 0.2s; }
    /* ]]> */
  </style>

  <!-- Dark Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Wave Graphics (Background Canvas Layer) -->
  <g opacity="0.35">
    <path class="wave1" fill="url(#glowGrad)" d="M-100,200 C150,120 350,300 650,180 C950,60 1150,240 1300,160 L1300,340 L-100,340 Z" />
    <path class="wave2" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6" d="M-50,160 C200,280 450,100 750,220 C1050,340 1200,120 1300,180" />
    <path class="wave1" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" d="M-50,220 C250,100 500,260 800,140 C1100,20 C1200,180 1300,120" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="1000" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="260" r="120" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Soundwave / Audio Visualizer Graphic (Decorative Right Side) -->
  <g transform="translate(920, 20)" opacity="0.75">
    <rect class="bar1" x="0" y="154" width="6" height="12" rx="3" fill="#6366f1" />
    <rect class="bar2" x="14" y="154" width="6" height="12" rx="3" fill="#818cf8" />
    <rect class="bar3" x="28" y="154" width="6" height="12" rx="3" fill="#a855f7" />
    <rect class="bar4" x="42" y="154" width="6" height="12" rx="3" fill="#ec4899" />
    <rect class="bar2" x="56" y="154" width="6" height="12" rx="3" fill="#38bdf8" />
    <rect class="bar1" x="70" y="154" width="6" height="12" rx="3" fill="#6366f1" />
  </g>

  <!-- Foreground Content Layer -->
  <g transform="translate(80, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 52)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle class="pulsing-dot" cx="18" cy="15" r="5" fill="#38bdf8" />
      <text x="34" y="20" class="badge-text">COMMUNITY CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title">
      Awesome Meeting Intelligence <tspan fill="url(#accentGrad)">Platform</tspan> 🎙️✨
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">
      Transcription, Speaker Diarization, AI Meeting Notes &amp; Sales Conversation Analytics
    </text>

    <!-- Bottom Accent Line -->
    <rect x="0" y="215" width="640" height="3" rx="1.5" fill="url(#accentGrad)" />
    
    <!-- Sub-features row -->
    <g transform="translate(0, 242)" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">
      <text x="0" y="0">⚡ Open-Source &amp; Local First</text>
      <text x="210" y="0">📊 Enterprise SaaS Intelligence</text>
      <text x="450" y="0">🤖 AI RAG &amp; Summarization</text>
    </g>
  </g>
</svg>
